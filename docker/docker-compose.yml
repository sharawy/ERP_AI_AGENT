version: "3.9"
services:
  hd-erp:
    build: ..
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - ERP_DB_PATH=sqlite:///erp.db
      - API_URL=http://localhost:8000
      - LLM_PROVIDER=openai
      - OPENAI_MODEL=gpt-4o-mini
      # - OPENAI_API_KEY=...
    volumes:
      - ../:/app
